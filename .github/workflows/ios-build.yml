name: Build ReTripper iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (required by Google Navigation SDK 11)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 is not installed on this runner; the Google Navigation SDK needs it."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure Google Maps API key from repository secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          # The key is never printed. GitHub also masks secret values in logs.
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY secret is not set. The app builds, but shows 'Google Maps is not configured' instead of a map."
            exit 0
          fi
          if ! printf '%s' "$GOOGLE_MAPS_API_KEY" | grep -Eq '^[A-Za-z0-9_-]{20,100}$'; then
            echo "::error::GOOGLE_MAPS_API_KEY secret has an unexpected format (letters, digits, '-' and '_' only)."
            exit 1
          fi
          umask 077
          echo "GOOGLE_MAPS_API_KEY = $GOOGLE_MAPS_API_KEY" > Config/Secrets.xcconfig
          echo "Google Maps API key configured from repository secret."

      - name: Generate Xcode project (Google Maps + Navigation + Places SDKs)
        run: xcodegen generate --spec project.yml

      - name: Confirm project and scheme
        run: |
          test -d ReTripper.xcodeproj
          xcodebuild -list -project ReTripper.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project ReTripper.xcodeproj \
            -scheme ReTripper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ReTripperDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee "$RUNNER_TEMP/ReTripper-build.log"

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/ReTripperDerivedData/Build/Products/Release-iphoneos/ReTripper.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [ "$BUNDLE_ID" != "com.nonick20.retripper" ]; then
            echo "Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          # Report (without printing it) whether a Google Maps key is embedded.
          GMS_KEY=$(/usr/libexec/PlistBuddy -c 'Print :GMSApiKey' "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -n "$GMS_KEY" ]; then
            echo "Google Maps API key: embedded (from repository secret)"
          else
            echo "::warning::Google Maps API key: NOT embedded. The app will show 'Google Maps is not configured'."
          fi
          unset GMS_KEY

          # Confirm the Google SDK frameworks/resources were bundled.
          ls "$APP_PATH" | grep -i -E 'google' || echo "::warning::No Google resource bundles found in the app."

          mkdir -p Payload
          ditto "$APP_PATH" "Payload/ReTripper.app"
          ditto -c -k --sequesterRsrc --keepParent Payload ReTripper.ipa

          unzip -t ReTripper.ipa
          unzip -l ReTripper.ipa | grep 'Payload/ReTripper.app/Info.plist'
          echo "Verified unsigned IPA: ReTripper.ipa"
          echo "Bundle identifier: $BUNDLE_ID"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReTripper-unsigned-IPA
          path: ReTripper.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Run unit tests on iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in data[runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          xcodebuild \
            -project ReTripper.xcodeproj \
            -scheme ReTripper \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/ReTripperTestData" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$RUNNER_TEMP/ReTripper-test.log"

      - name: Remove generated secrets file
        if: always()
        run: rm -f Config/Secrets.xcconfig

      - name: Report compiler and test errors as annotations
        if: failure()
        run: |
          # Annotations are readable without downloading logs.
          for log in "$RUNNER_TEMP"/ReTripper-build.log "$RUNNER_TEMP"/ReTripper-test.log; do
            [ -f "$log" ] || continue
            grep -E '(: error: |error: -\[| failed \()' "$log" \
              | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
          done

      - name: Upload logs if build or tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ReTripper-logs
          path: |
            ${{ runner.temp }}/ReTripper-build.log
            ${{ runner.temp }}/ReTripper-test.log
          if-no-files-found: ignore
          retention-days: 7
