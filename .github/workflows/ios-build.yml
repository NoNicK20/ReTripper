name: Build ReTripper iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (no Google SDK, no credentials)
        run: xcodegen generate --spec project.yml

      - name: Confirm project and scheme
        run: |
          test -d ReTripper.xcodeproj
          xcodebuild -list -project ReTripper.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project ReTripper.xcodeproj \
            -scheme ReTripper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ReTripperDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee "$RUNNER_TEMP/ReTripper-build.log"

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/ReTripperDerivedData/Build/Products/Release-iphoneos/ReTripper.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [ "$BUNDLE_ID" != "com.nonick20.retripper" ]; then
            echo "Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          # The CI build must not contain a Google Maps key.
          GMS_KEY=$(/usr/libexec/PlistBuddy -c 'Print :GMSApiKey' "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -n "$GMS_KEY" ]; then
            echo "A Google Maps API key was embedded in the CI build. Refusing to publish."
            exit 1
          fi

          mkdir -p Payload
          ditto "$APP_PATH" "Payload/ReTripper.app"
          ditto -c -k --sequesterRsrc --keepParent Payload ReTripper.ipa

          unzip -t ReTripper.ipa
          unzip -l ReTripper.ipa | grep 'Payload/ReTripper.app/Info.plist'
          echo "Verified unsigned IPA: ReTripper.ipa"
          echo "Bundle identifier: $BUNDLE_ID"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReTripper-unsigned-IPA
          path: ReTripper.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Run unit tests on iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in data[runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          xcodebuild \
            -project ReTripper.xcodeproj \
            -scheme ReTripper \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/ReTripperTestData" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$RUNNER_TEMP/ReTripper-test.log"

      - name: Report compiler and test errors as annotations
        if: failure()
        run: |
          # Annotations are readable without downloading logs.
          for log in "$RUNNER_TEMP"/ReTripper-build.log "$RUNNER_TEMP"/ReTripper-test.log; do
            [ -f "$log" ] || continue
            grep -E '(: error: |error: -\[| failed \()' "$log" \
              | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
          done

      - name: Upload logs if build or tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ReTripper-logs
          path: |
            ${{ runner.temp }}/ReTripper-build.log
            ${{ runner.temp }}/ReTripper-test.log
          if-no-files-found: ignore
          retention-days: 7

  # Compiles the optional Google Navigation SDK integration. It never uses a key
  # and does not block the main build while the integration is being verified.
  google-navigation-sdk:
    runs-on: macos-15-intel
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (required by Navigation SDK 11)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::warning::Xcode 26 is not installed on this runner; skipping Google SDK build."
            echo "SKIP_GOOGLE=1" >> "$GITHUB_ENV"
          else
            sudo xcode-select -s "$XCODE"
            xcodebuild -version
          fi

      - name: Install XcodeGen
        if: env.SKIP_GOOGLE != '1'
        run: brew install xcodegen

      - name: Generate project with Google Navigation SDK
        if: env.SKIP_GOOGLE != '1'
        run: xcodegen generate --spec project.google.yml

      - name: Build with Google Navigation SDK (no API key)
        if: env.SKIP_GOOGLE != '1'
        run: |
          set -o pipefail
          xcodebuild \
            -project ReTripper.xcodeproj \
            -scheme ReTripper \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/GoogleDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ReTripper-google.log"

      - name: Report Google build errors as annotations
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/ReTripper-google.log" ] || exit 0
          grep -E ': error: ' "$RUNNER_TEMP/ReTripper-google.log" \
            | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -10 \
            | while IFS= read -r line; do echo "::error::$line"; done
