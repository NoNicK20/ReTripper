# Optional XcodeGen spec that adds the Google Maps Navigation SDK.
# Usage: xcodegen generate --spec project.google.yml
# Requires Xcode 26+ and, at runtime, a Google Maps API key in Config/Secrets.xcconfig.
# The default project.yml builds without Google and uses Apple Maps (MapKit).

include:
  - project.yml

packages:
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    from: 11.0.0

targets:
  ReTripper:
    dependencies:
      - package: GoogleNavigation
