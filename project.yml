# ReTripper iOS Project Configuration for XcodeGen
# This file is used by GitHub Actions to generate the Xcode project on macOS runners.

name: ReTripper

targets:
  ReTripper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonick20.retripper
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    info:
      properties:
        CFBundleName: ReTripper
        CFBundleDisplayName: ReTripper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  ReTripper:
    build:
      targets:
        ReTripper: all
    run:
      config: Debug
    archive:
      config: Release
